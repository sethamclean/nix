[supervisord]
user=root
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
environment=PATH="/nix/var/nix/profiles/per-user/seth/daemons/bin:/nix/var/nix/profiles/per-user/seth/profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[unix_http_server]
file=/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:dockerd]
command=dockerd
autorestart=true
stdout_logfile=/var/log/dockerd-stdout.log
stderr_logfile=/var/log/dockerd-stderr.log

[program:sshd]
command=sh -c "$(which sshd) -D"
autorestart=true
stdout_logfile=/var/log/sshd-stdout.log
stderr_logfile=/var/log/sshd-stderr.log

[program:tailscaled]
command=tailscaled
autorestart=true
stdout_logfile=/var/log/tailscaled-stdout.log
stderr_logfile=/var/log/tailscaled-stderr.log

[program:searxng]
command=sh -c 'docker rm -f searxng >/dev/null 2>&1 || true; exec docker run --rm --name searxng -p 8080:8080 -v /etc/searxng/:/etc/searxng/ -e SEARXNG_SECRET searxng/searxng'
autorestart=true
stdout_logfile=/var/log/searxng-stdout.log
stderr_logfile=/var/log/searxng-stderr.log

[program:socat_port_forward]
command=socat TCP-LISTEN:4000,fork TCP:localhost:8250
autorestart=true
stdout_logfile=/var/log/socat-port-forward-stdout.log
stderr_logfile=/var/log/socat-port-forward-stderr.log

[program:codebase-memory-mcp]
command=sh -c 'tail -f /dev/null | codebase-memory-mcp --ui=true --port=9749'
user=seth
environment=HOME="/home/seth",CBM_ALLOWED_ROOT="/workspaces"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/codebase-memory-mcp-stdout.log
stderr_logfile=/var/log/codebase-memory-mcp-stderr.log

[program:codebase-memory-indexer]
command=sh -c 'for i in $(seq 30); do curl -sf http://localhost:9749 >/dev/null && break; sleep 2; done; while true; do for g in /workspaces/*/.git; do [ -e "$g" ] && codebase-memory-mcp cli --quiet index_repository --repo-path "$(dirname "$g")"; done; sleep 600; done'
user=seth
environment=HOME="/home/seth",CBM_ALLOWED_ROOT="/workspaces"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/codebase-memory-indexer-stdout.log
stderr_logfile=/var/log/codebase-memory-indexer-stderr.log
